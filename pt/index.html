<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#1f3028">
    <meta name="description" content="Reserve a data: Maria & Noah em 24 de julho de 2027 em Leopoldshafen, Alemanha.">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Maria & Noah | Reserve a data">
    <meta property="og:description" content="24 de julho de 2027 | Leopoldshafen, Alemanha">
    <meta property="og:url" content="https://noahwatling.github.io/maria-noah-save-the-date/pt/">
    <meta property="og:image" content="https://noahwatling.github.io/maria-noah-save-the-date/assets/poster.jpg">
    <meta property="og:video" content="https://noahwatling.github.io/maria-noah-save-the-date/assets/save-the-date.mp4">

    <title>Maria & Noah | Reserve a data</title>
    <link rel="preload" href="../assets/poster.jpg" as="image">
    <link rel="stylesheet" href="../styles.css?v=3">
  </head>
  <body data-default-lang="pt">
    <main class="invite" aria-label="Save the date de Maria e Noah">
      <video class="invite__video" src="../assets/save-the-date.mp4" poster="../assets/poster.jpg" autoplay loop playsinline preload="metadata"></video>
      <div class="invite__shade" aria-hidden="true"></div>

      <div class="invite__topbar" aria-label="Invitation controls">
        <button class="sound-button" type="button" id="soundButton" aria-label="Ligar som" aria-pressed="false">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 9v6h4l5 4V5L8 9H4"></path>
            <g class="icon-sound-on"><path d="M17 9.5a4 4 0 0 1 0 5"></path><path d="M19.5 7a7.5 7.5 0 0 1 0 10"></path></g>
            <g class="icon-sound-off"><path d="M17 9l4 4"></path><path d="M21 9l-4 4"></path></g>
          </svg>
        </button>

        <div class="lang-switch" role="group" aria-label="Language">
          <button class="lang-button" type="button" data-lang="en" aria-pressed="false">EN</button>
          <button class="lang-button" type="button" data-lang="de" aria-pressed="false">DE</button>
          <button class="lang-button is-active" type="button" data-lang="pt" aria-pressed="true">PT</button>
        </div>
      </div>

      <section class="invite__content">
        <p class="invite__label" data-i18n="label">Reserve a data</p>
        <h1><span>Maria</span><span>&amp; Noah</span></h1>
        <p class="invite__date" data-i18n="date">24 de julho de 2027</p>
        <p class="invite__place" data-i18n="place">Leopoldshafen, Alemanha</p>
      </section>

      <nav class="invite__actions" aria-label="Save the date actions">
        <a class="action action--primary" href="../calendar.ics" download="maria-noah-save-the-date.ics" aria-label="Adicionar Maria e Noah ao calendário">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M8 2v4"></path><path d="M16 2v4"></path><path d="M3 10h18"></path><rect x="3" y="4" width="18" height="18" rx="2"></rect></svg>
          <span data-i18n="calendar">Calendário</span>
        </a>
      </nav>
    </main>

    <script src="../script.js?v=3"></script>
  </body>
</html>
